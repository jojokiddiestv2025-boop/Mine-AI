
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mine AI | Elite Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo-glow: rgba(99, 102, 241, 0.4);
      --slate-dark: #020617;
    }
    html {
      scroll-behavior: smooth;
      background-color: var(--slate-dark);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      overflow-x: hidden;
      overflow-y: auto; /* Global Scroll Enabled */
    }
    .bg-grid {
      background-image: 
        linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      position: fixed; /* Keep background static during scroll */
      inset: 0;
      z-index: -10;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-indigo {
      box-shadow: 0 0 25px var(--indigo-glow);
    }
    /* Elite Global Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--slate-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.1);
      border-radius: 5px;
      border: 2px solid var(--slate-dark);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.3);
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    .animate-pulse-slow {
      animation: pulse-slow 8s ease-in-out infinite;
    }
    .parallax-glow {
      will-change: transform;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@^19.2.4",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "react/": "https://esm.sh/react@^19.2.4/",
      "firebase/": "https://esm.sh/firebase@^12.8.0/",
      "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
    }
  }
  </script>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
  <div class="bg-grid"></div>
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div id="glow-1" class="parallax-glow absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/10 blur-[120px] rounded-full animate-pulse-slow"></div>
    <div id="glow-2" class="parallax-glow absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-600/10 blur-[120px] rounded-full animate-pulse-slow delay-1000"></div>
  </div>
  <div id="root"></div>

  <script>
    // Add Parallax movement on scroll
    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY;
      const g1 = document.getElementById('glow-1');
      const g2 = document.getElementById('glow-2');
      if (g1) g1.style.transform = `translateY(${scrolled * 0.1}px) translateX(${scrolled * 0.05}px)`;
      if (g2) g2.style.transform = `translateY(${-scrolled * 0.1}px) translateX(${-scrolled * 0.05}px)`;
    });
  </script>
</body>
</html>
